<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PyCampus Classroom</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/theme/material-darker.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/python/python.min.js"></script>
<style>
  :root { --accent: #ffb020; --ink: #f3f1ea; --panel: rgba(20, 24, 32, .88); --line: rgba(255,255,255,.14); }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #1a1d24; color: var(--ink); font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
  canvas { display: block; }
  button { font: inherit; cursor: pointer; }
  .hidden { display: none !important; }

  #labels { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }
  .tag { position: absolute; transform: translate(-50%, -100%); display: flex; flex-direction: column; align-items: center; gap: 4px; white-space: nowrap; }
  .name { pointer-events: auto; cursor: pointer; color: #fff; background: rgba(0,0,0,.6); padding: 2px 8px; border-radius: 10px; font-size: 13px; font-weight: 600; }
  .name.me { background: rgba(214, 120, 20, .9); }
  .name .prof { color: var(--accent); margin-left: 4px; }
  .name.me .prof { color: #fff3c4; }
  .hand { font-size: 22px; animation: wave 1s ease-in-out infinite alternate; }
  @keyframes wave { to { transform: rotate(14deg); } }
  .bubble { max-width: 220px; white-space: normal; text-align: center; background: #fff; color: #222; padding: 6px 10px; border-radius: 12px; font-size: 14px; box-shadow: 0 2px 8px rgba(0,0,0,.35); position: relative; }
  .bubble::after { content: ""; position: absolute; left: 50%; bottom: -6px; margin-left: -6px; border: 6px solid transparent; border-bottom: 0; border-top-color: #fff; }

  #hud { position: fixed; top: 12px; left: 12px; font-size: 13px; background: var(--panel); padding: 8px 12px; border-radius: 10px; line-height: 1.55; max-width: calc(100% - 48px); }
  #hud b { color: var(--accent); }
  #actions { position: fixed; right: 12px; bottom: 16px; display: flex; flex-direction: column; gap: 8px; }
  #actions button { background: var(--panel); color: var(--ink); border: 1px solid var(--line); border-radius: 22px; padding: 9px 14px; }
  #actions button.on { background: var(--accent); color: #222; }
  #chat { position: fixed; left: 50%; bottom: 16px; transform: translateX(-50%); width: min(440px, calc(100% - 220px)); }
  #chat input { width: 100%; box-sizing: border-box; padding: 10px 14px; border-radius: 22px; border: 2px solid var(--line); background: rgba(0,0,0,.6); color: #fff; font-size: 15px; outline: none; }
  #chat input:focus { border-color: var(--accent); }
  #log { position: fixed; left: 12px; bottom: 16px; width: min(300px, 40vw); max-height: 30vh; overflow-y: auto; font-size: 13px; background: var(--panel); border-radius: 10px; padding: 6px 10px; }
  #log:empty { display: none; }
  #log div { padding: 2px 0; overflow-wrap: anywhere; }
  #log b { color: var(--accent); }
  #log .sys { opacity: .65; font-style: italic; }
  #notice { position: fixed; top: 12px; left: 50%; transform: translateX(-50%); background: var(--accent); color: #222; padding: 8px 14px; border-radius: 10px; font-size: 14px; z-index: 5; }

  #join { position: fixed; inset: 0; display: grid; place-items: center; background: rgba(10,12,16,.55); }
  #join form { background: var(--panel); padding: 22px 24px; border-radius: 16px; width: min(340px, calc(100% - 32px)); box-sizing: border-box; text-align: center; box-shadow: 0 10px 40px rgba(0,0,0,.5); }
  #join h1 { margin: 0 0 4px; font-size: 22px; }
  #join p { margin: 0 0 14px; opacity: .75; font-size: 13px; }
  #join input { width: 100%; box-sizing: border-box; padding: 10px 12px; border-radius: 10px; border: 0; font-size: 16px; margin-bottom: 12px; }
  .roles { display: flex; gap: 10px; }
  .roles button { flex: 1; padding: 11px 6px; border: 0; border-radius: 10px; font-size: 15px; font-weight: 700; background: var(--accent); color: #222; }
  .roles button.alt { background: #4a82ff; color: #fff; }
  .roles button:disabled { background: #555; color: #999; cursor: not-allowed; }
  #joinMsg { margin-top: 10px; font-size: 13px; min-height: 1.2em; opacity: .85; }

  #board { position: fixed; inset: 16px; display: flex; flex-direction: column; background: #161a22; border: 1px solid var(--line); border-radius: 14px; box-shadow: 0 20px 60px rgba(0,0,0,.6); overflow: hidden; }
  #boardHead { display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-bottom: 1px solid var(--line); }
  #boardHead h2 { margin: 0; font-size: 16px; flex: 1; }
  #boardHead .spot { font-size: 13px; color: var(--accent); }
  #boardClose { background: none; border: 1px solid var(--line); color: var(--ink); border-radius: 8px; padding: 4px 10px; }
  #boardBody { flex: 1; display: flex; min-height: 0; }
  #tabs { width: 170px; border-right: 1px solid var(--line); overflow-y: auto; padding: 8px; display: flex; flex-direction: column; gap: 4px; }
  #tabs button { text-align: left; background: none; color: var(--ink); border: 0; border-radius: 8px; padding: 8px 10px; font-size: 14px; }
  #tabs button.active { background: rgba(255,176,32,.18); color: var(--accent); }
  #tabs .empty { font-size: 12px; opacity: .6; padding: 6px 10px; }
  #pane { flex: 1; display: flex; flex-direction: column; min-width: 0; padding: 12px; gap: 10px; }
  #paneTitle { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 14px; }
  #paneTitle .who { font-weight: 700; flex: 1; }
  .btn { background: #2b3242; color: var(--ink); border: 1px solid var(--line); border-radius: 8px; padding: 6px 12px; font-size: 13px; }
  .btn.primary { background: var(--accent); color: #222; border: 0; font-weight: 700; }
  #problemView { flex: 1; overflow: auto; white-space: pre-wrap; font-size: 16px; line-height: 1.5; background: #0f1218; border-radius: 10px; padding: 14px; }
  #problemEdit { flex: 1; resize: none; font: 15px/1.5 ui-monospace, Menlo, Consolas, monospace; background: #0f1218; color: var(--ink); border: 1px solid var(--line); border-radius: 10px; padding: 12px; }
  #editorWrap { flex: 1; min-height: 0; border-radius: 10px; overflow: hidden; border: 1px solid var(--line); }
  #editorWrap .CodeMirror { height: 100%; font-size: 14px; }
  #output { max-height: 28%; min-height: 3em; overflow: auto; margin: 0; background: #0b0d12; border-radius: 10px; padding: 10px; font: 13px/1.4 ui-monospace, Menlo, Consolas, monospace; white-space: pre-wrap; color: #b9f6ca; }
  #output.err { color: #ffab91; }
  @media (max-width: 640px) {
    #board { inset: 0; border-radius: 0; }
    #boardBody { flex-direction: column; }
    #tabs { width: auto; flex-direction: row; overflow-x: auto; border-right: 0; border-bottom: 1px solid var(--line); }
    #chat { width: calc(100% - 140px); left: 12px; transform: none; }
    #log { display: none; }
  }
</style>
</head>
<body>
<div id="labels"></div>
<div id="hud" class="hidden"></div>
<div id="notice" class="hidden"></div>
<div id="log" class="hidden"></div>
<div id="chat" class="hidden"><input id="chatInput" maxlength="200" placeholder="Press Enter to chat" autocomplete="off"></div>
<div id="actions" class="hidden">
  <button id="handBtn" title="Raise hand (H)">✋ Raise hand</button>
  <button id="boardBtn" title="Open the whiteboard (B)">📋 Board</button>
</div>

<div id="join">
  <form id="joinForm" onsubmit="return false">
    <h1>🐍 PyCampus Classroom</h1>
    <p>Pick a nickname and a role.</p>
    <input id="nameInput" maxlength="16" autocomplete="off" aria-label="Nickname">
    <div class="roles">
      <button type="button" id="asStudent">Student</button>
      <button type="button" id="asProf" class="alt">Professor</button>
    </div>
    <div id="joinMsg">Connecting…</div>
  </form>
</div>

<div id="board" class="hidden" role="dialog" aria-label="Whiteboard">
  <div id="boardHead"><h2>📋 Whiteboard</h2><span class="spot" id="spotLabel"></span><button id="boardClose">Close (Esc)</button></div>
  <div id="boardBody">
    <div id="tabs"></div>
    <div id="pane">
      <div id="paneTitle"></div>
      <div id="problemView" class="hidden"></div>
      <textarea id="problemEdit" class="hidden" maxlength="2000" placeholder="Write a problem for the class, then post it to the whiteboard."></textarea>
      <div id="editorWrap" class="hidden"></div>
      <pre id="output" class="hidden"></pre>
    </div>
  </div>
</div>

<script type="importmap">{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.min.js" } }</script>
<script type="module">
import * as THREE from 'three';

// ================= Config =================
// Supabase Realtime syncs the classroom when hosted (e.g. Vercel). The anon / publishable key is public by design.
const SUPABASE_URL = 'https://drsrjhuoehjznlbzbowm.supabase.co';
const SUPABASE_KEY = 'sb_publishable_K7bKtSkEoOR72vaM5Osweg_o73aCWNc';
const SUPABASE_JS = 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.3/+esm';
const PYODIDE_URL = window.PYODIDE_URL || 'https://cdn.jsdelivr.net/pyodide/v0.26.4/full/';
const CHANNEL = 'py-classroom';
const MAX_PLAYERS = 10;
const MAX_CODE = 10000;
const MY_ID = Math.random().toString(36).slice(2, 10).padEnd(8, '0');
const $ = (id) => document.getElementById(id);

// ================= Scene: the classroom =================
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
document.body.prepend(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x2a2f3a);
const camera = new THREE.PerspectiveCamera(55, innerWidth / innerHeight, 0.1, 100);
camera.position.set(0, 7, 12);
camera.lookAt(0, 1.5, -4);
scene.add(new THREE.HemisphereLight(0xfff4e0, 0x404050, 1.1));
const sun = new THREE.DirectionalLight(0xffffff, 0.9);
sun.position.set(6, 12, 6);
scene.add(sun);

const ROOM = { w: 20, d: 18, h: 4.2 }; // x: -10..10, z: -9..9
const mat = (c) => new THREE.MeshLambertMaterial({ color: c });
const floor = new THREE.Mesh(new THREE.PlaneGeometry(ROOM.w, ROOM.d), mat(0x9b7a52));
floor.rotation.x = -Math.PI / 2;
scene.add(floor);
const wallMat = mat(0xe8e2d4);
function wall(w, x, z, ry) {
  const m = new THREE.Mesh(new THREE.PlaneGeometry(w, ROOM.h), wallMat);
  m.position.set(x, ROOM.h / 2, z); m.rotation.y = ry; scene.add(m);
}
wall(ROOM.w, 0, -ROOM.d / 2, 0);
wall(ROOM.d, -ROOM.w / 2, 0, Math.PI / 2);
wall(ROOM.d, ROOM.w / 2, 0, -Math.PI / 2);
for (const z of [-4, 1, 6]) { // windows
  const win = new THREE.Mesh(new THREE.PlaneGeometry(2.6, 1.6), new THREE.MeshBasicMaterial({ color: 0x9fd3ff }));
  win.position.set(ROOM.w / 2 - 0.01, 2.3, z); win.rotation.y = -Math.PI / 2; scene.add(win);
}

// Whiteboard with a live canvas texture
const boardCanvas = document.createElement('canvas');
boardCanvas.width = 1280; boardCanvas.height = 560;
const bctx = boardCanvas.getContext('2d');
const boardTex = new THREE.CanvasTexture(boardCanvas);
boardTex.colorSpace = THREE.SRGBColorSpace;
const boardFrame = new THREE.Mesh(new THREE.BoxGeometry(9.4, 4.1, 0.1), mat(0x7a7f8a));
boardFrame.position.set(0, 2.25, -ROOM.d / 2 + 0.06);
scene.add(boardFrame);
const boardMesh = new THREE.Mesh(new THREE.PlaneGeometry(9, 3.94), new THREE.MeshBasicMaterial({ map: boardTex }));
boardMesh.position.set(0, 2.25, -ROOM.d / 2 + 0.12);
scene.add(boardMesh);

const solids = []; // { x, z, hw, hd } boxes for collision
function box(w, h, d, color, x, y, z) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat(color));
  m.position.set(x, y, z); scene.add(m); return m;
}
box(3, 0.9, 1.1, 0x5d4128, 0, 0.45, -6.2); // professor desk
solids.push({ x: 0, z: -6.2, hw: 1.5, hd: 0.55 });

// Student desks + chairs (the seats)
const seats = [];
const chairMeshes = [];
[-6.4, -3.2, 0, 3.2, 6.4].forEach((x) => [-1.5, 2.5].forEach((z) => {
  box(1.6, 0.08, 0.9, 0xc8a26b, x, 0.78, z);
  for (const [lx, lz] of [[-0.7, -0.35], [0.7, -0.35], [-0.7, 0.35], [0.7, 0.35]]) box(0.08, 0.76, 0.08, 0x444444, x + lx, 0.38, z + lz);
  solids.push({ x, z, hw: 0.8, hd: 0.45 });
  const cz = z + 0.95, index = seats.length;
  const chair = new THREE.Group();
  const seatTop = new THREE.Mesh(new THREE.BoxGeometry(0.6, 0.08, 0.55), mat(0x3d6fb6));
  seatTop.position.y = 0.48;
  const back = new THREE.Mesh(new THREE.BoxGeometry(0.6, 0.6, 0.08), mat(0x3d6fb6));
  back.position.set(0, 0.8, 0.26);
  const leg = new THREE.Mesh(new THREE.CylinderGeometry(0.04, 0.04, 0.46), mat(0x444444));
  leg.position.y = 0.23;
  chair.add(seatTop, back, leg);
  chair.position.set(x, 0, cz);
  for (const c of chair.children) { c.userData.seat = index; chairMeshes.push(c); }
  scene.add(chair);
  seats.push({ index, x, z: cz });
}));

// ================= Avatars =================
const players = new Map(); // id -> view
const labels = $('labels');
const pickables = [];

function makeAvatar(meta) {
  const group = new THREE.Group();
  const body = new THREE.Mesh(new THREE.CapsuleGeometry(0.3, 0.6, 4, 10), mat(new THREE.Color(meta.color)));
  body.position.y = 0.65;
  const head = new THREE.Mesh(new THREE.SphereGeometry(0.27, 16, 12), mat(0xf1c9a0));
  head.position.y = 1.42;
  for (const sx of [-0.09, 0.09]) {
    const eye = new THREE.Mesh(new THREE.SphereGeometry(0.035, 6, 6), new THREE.MeshBasicMaterial({ color: 0x111111 }));
    eye.position.set(sx, 1.47, 0.24); group.add(eye);
  }
  const arm = new THREE.Mesh(new THREE.CapsuleGeometry(0.07, 0.45, 3, 6), mat(new THREE.Color(meta.color)));
  arm.position.set(0.34, 1.55, 0); arm.rotation.z = 0.15; arm.visible = false;
  group.add(body, head, arm);
  if (meta.role === 'professor') { // mortarboard hat
    const cap = new THREE.Mesh(new THREE.BoxGeometry(0.62, 0.05, 0.62), mat(0x111111));
    cap.position.y = 1.7; cap.rotation.y = Math.PI / 4;
    const crown = new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.22, 0.14, 12), mat(0x111111));
    crown.position.y = 1.62;
    group.add(cap, crown);
  }
  body.userData.id = head.userData.id = meta.id;
  pickables.push(body, head);
  scene.add(group);

  const tag = document.createElement('div'); tag.className = 'tag';
  const handEl = document.createElement('div'); handEl.className = 'hand'; handEl.textContent = '✋';
  const nameEl = document.createElement('div');
  nameEl.className = 'name' + (meta.id === MY_ID ? ' me' : '');
  nameEl.addEventListener('click', () => { zoomId = meta.id; });
  tag.append(handEl, nameEl);
  labels.appendChild(tag);
  const seat = meta.seat != null ? seats[meta.seat] : null;
  const start = seat ? { x: seat.x, z: seat.z, ry: Math.PI } : { x: meta.x, z: meta.z, ry: meta.ry };
  const view = { group, tag, nameEl, handEl, arm, bubbleEl: null, bubbleTimer: 0, target: start, meta, bob: 0, role: meta.role };
  players.set(meta.id, view);
  group.position.set(start.x, 0, start.z);
  group.rotation.y = start.ry;
  updateAvatar(view, meta);
  return view;
}

function updateAvatar(view, meta) {
  view.meta = meta;
  view.nameEl.textContent = meta.name;
  if (meta.role === 'professor') { const b = document.createElement('span'); b.className = 'prof'; b.textContent = 'Prof.'; view.nameEl.appendChild(b); }
  view.handEl.style.display = meta.hand ? '' : 'none';
  view.arm.visible = !!meta.hand;
}

function removeAvatar(id) {
  const v = players.get(id);
  if (!v) return;
  scene.remove(v.group);
  for (let i = pickables.length - 1; i >= 0; i--) if (pickables[i].userData.id === id) pickables.splice(i, 1);
  v.tag.remove(); clearTimeout(v.bubbleTimer);
  players.delete(id);
  if (zoomId === id) zoomId = null;
}

function showBubble(id, text) {
  const v = players.get(id);
  if (!v) return;
  if (!v.bubbleEl) { v.bubbleEl = document.createElement('div'); v.bubbleEl.className = 'bubble'; v.tag.insertBefore(v.bubbleEl, v.handEl); }
  v.bubbleEl.textContent = text;
  clearTimeout(v.bubbleTimer);
  v.bubbleTimer = setTimeout(() => { v.bubbleEl?.remove(); v.bubbleEl = null; }, 5000);
}

// ================= Classroom state =================
let ch = null;            // realtime channel (Supabase or the local relay)
let me = null;            // my presence meta once I click a role
let joined = false;
let roster = [];          // presence metas, earliest first, max 10
let professorId = null;   // earliest professor in the roster
const panes = new Map();  // studentId -> { text, output, error }
const board = { problem: '', spotlight: null };
let zoomId = null;

const nameOf = (id) => roster.find((p) => p.id === id)?.name || 'Someone';
const isProfessor = () => joined && professorId === MY_ID;
const students = () => roster.filter((p) => p.id !== professorId);

function readPresence() {
  const all = Object.values(ch.presenceState()).map((m) => m[0]).filter((p) => p && p.id && p.name);
  all.sort((a, b) => a.at - b.at || (a.id < b.id ? -1 : 1));
  return all;
}

function onPresence() {
  const all = readPresence();
  const list = all.slice(0, MAX_PLAYERS);
  const prevProf = professorId;
  roster = list;
  professorId = list.find((p) => p.role === 'professor')?.id || null;

  if (!joined) {
    updateJoinScreen(all);
    if (!me || !all.some((p) => p.id === MY_ID)) return;
    if (!list.some((p) => p.id === MY_ID)) { ch.untrack(); me = null; $('joinMsg').textContent = 'The classroom is full (10 people). Try again soon.'; return; }
    joined = true;
    enterRoom();
  }

  if (me.role === 'professor' && professorId !== MY_ID && list.some((p) => p.id === MY_ID)) {
    me = { ...me, role: 'student' }; track(); // someone else got there first
    panes.set(MY_ID, panes.get(MY_ID) || { text: STARTER, output: '', error: false });
    note('Someone else is already the professor, so you joined as a student.');
  }
  if (me.seat != null) { // two people in one seat: the earlier one keeps it
    const holder = list.find((p) => p.seat === me.seat);
    if (holder && holder.id !== MY_ID) { standUp(); note('That seat was just taken.'); }
  }

  const ids = new Set(list.map((p) => p.id));
  for (const id of [...players.keys()]) if (!ids.has(id)) {
    if (id !== MY_ID) logSys(`${players.get(id).meta.name} left`);
    removeAvatar(id); panes.delete(id);
  }
  for (const p of list) {
    let v = players.get(p.id);
    const meta = p.id === MY_ID ? me : p;
    if (v && v.role !== meta.role) { removeAvatar(p.id); v = null; } // rebuild to add/remove the hat
    if (!v) {
      makeAvatar(meta);
      if (p.id !== MY_ID) logSys(`${p.name} is here${p.role === 'professor' ? ' (professor)' : ''}`);
    } else {
      const wasSeated = v.meta.seat != null;
      updateAvatar(v, meta);
      if (p.id !== MY_ID && p.seat != null) { const s = seats[p.seat]; v.target = { x: s.x, z: s.z, ry: Math.PI }; }
      else if (p.id !== MY_ID && wasSeated) v.target = { x: p.x, z: p.z, ry: p.ry };
    }
  }
  if (prevProf && prevProf !== professorId && board.spotlight) board.spotlight = null;
  if (prevProf && !professorId) logSys('The professor left. The spotlight is cleared, and anyone can now join as professor.');
  if (board.spotlight && !ids.has(board.spotlight)) board.spotlight = null;
  refreshUI();
}

function updateJoinScreen(all) {
  const profTaken = all.slice(0, MAX_PLAYERS).some((p) => p.role === 'professor');
  const full = all.length >= MAX_PLAYERS;
  $('asProf').disabled = profTaken || full;
  $('asProf').textContent = profTaken ? 'Professor (taken)' : 'Professor';
  $('asStudent').disabled = full;
  if (!me) $('joinMsg').textContent = full ? 'The classroom is full (10 people). Try again soon.' : `${all.length}/${MAX_PLAYERS} in class${profTaken ? '' : ' · no professor yet'}`;
}

function track() { if (me && ch) ch.track({ ...me }); }
const send = (event, payload) => ch && ch.send({ type: 'broadcast', event, payload: { ...payload, id: MY_ID } });
const STARTER = '# Write your Python here\nprint("Hello, class!")\n';

function join(role) {
  if (me || !ch) return;
  const angle = Math.random() * Math.PI;
  me = {
    id: MY_ID, name: ($('nameInput').value.trim() || 'Guest').slice(0, 16), role, at: Date.now(),
    color: `hsl(${Math.floor(Math.random() * 360)}, 60%, 55%)`,
    x: Math.cos(angle) * 3, z: 6.3 + Math.sin(angle), ry: Math.PI, seat: null, hand: false,
  };
  $('joinMsg').textContent = 'Joining…';
  track();
}

function enterRoom() {
  $('join').classList.add('hidden');
  for (const id of ['hud', 'chat', 'actions', 'log']) $(id).classList.remove('hidden');
  if (me.role === 'student') panes.set(MY_ID, { text: STARTER, output: '', error: false });
  send('hello', {});
  if (me.role === 'student') send('code', { text: STARTER, output: '', error: false });
  logSys(`You joined as ${me.role}.`);
}

// ---- incoming broadcasts ----
const handlers = {
  hello() { // a newcomer asks for the current state
    if (isProfessor()) sendBoard();
    const mine = panes.get(MY_ID);
    if (mine && me?.role === 'student') send('code', { text: mine.text, output: mine.output, error: mine.error });
  },
  move(p) { const v = players.get(p.id); if (v && v.meta.seat == null) v.target = { x: +p.x || 0, z: +p.z || 0, ry: +p.ry || 0 }; },
  chat(p) {
    const text = String(p.text || '').slice(0, 200);
    if (!text || !players.has(p.id)) return;
    showBubble(p.id, text); logChat(p.id, text);
  },
  code(p) {
    if (!roster.some((r) => r.id === p.id) || p.id === professorId) return; // only students have panes
    panes.set(p.id, { text: String(p.text || '').slice(0, MAX_CODE), output: String(p.output || '').slice(0, 4000), error: !!p.error });
    if (board.spotlight === p.id) drawBoard();
    if (boardOpen()) { if (activeTab === p.id) renderPane(true); renderTabs(); }
  },
  board(p) {
    if (p.id !== professorId) return; // only the professor controls the whiteboard
    board.problem = String(p.problem || '').slice(0, 2000);
    board.spotlight = roster.some((r) => r.id === p.spotlight && r.id !== professorId) ? p.spotlight : null;
    refreshUI();
  },
};
function sendBoard() { send('board', { problem: board.problem, spotlight: board.spotlight }); }

// ================= Realtime connection =================
class LocalChannel { // the same calls as a Supabase channel, backed by server.js
  constructor() { this.h = { sync: [], bc: {} }; this.state = {}; }
  on(type, filter, cb) { if (type === 'presence') this.h.sync.push(cb); else (this.h.bc[filter.event] ||= []).push(cb); return this; }
  subscribe(cb) {
    const es = new EventSource('/events?id=' + MY_ID);
    es.addEventListener('presence', (e) => { this.state = JSON.parse(e.data); this.h.sync.forEach((f) => f()); });
    es.addEventListener('bc', (e) => { const m = JSON.parse(e.data); (this.h.bc[m.event] || []).forEach((f) => f({ payload: m.payload })); });
    es.onopen = () => cb('SUBSCRIBED');
    es.onerror = () => { if (es.readyState === EventSource.CLOSED) cb('CHANNEL_ERROR'); };
    return this;
  }
  post(path, body) { return fetch(path, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ id: MY_ID, ...body }) }).catch(() => {}); }
  presenceState() { return this.state; }
  track(meta) { return this.post('/track', { meta }); }
  untrack() { return this.post('/untrack', {}); }
  send(m) { return this.post('/send', { event: m.event, payload: m.payload }); }
}

let posDirty = false;
async function connect() {
  if (window.LOCAL_RELAY) ch = new LocalChannel();
  else {
    try {
      const { createClient } = await import(SUPABASE_JS);
      const sb = createClient(SUPABASE_URL, SUPABASE_KEY, { realtime: { worker: true } });
      ch = sb.channel(CHANNEL, { config: { presence: { key: MY_ID }, broadcast: { self: false } } });
    } catch { $('joinMsg').textContent = 'Could not load the classroom service. Reload to try again.'; return; }
  }
  ch.on('presence', { event: 'sync' }, onPresence);
  for (const ev of Object.keys(handlers)) ch.on('broadcast', { event: ev }, ({ payload }) => payload && payload.id !== MY_ID && handlers[ev](payload));
  ch.subscribe((status) => {
    if (status === 'SUBSCRIBED') { if (me) track(); else onPresence(); }
    else if (status === 'CHANNEL_ERROR' || status === 'TIMED_OUT') { if (!joined) $('joinMsg').textContent = 'Could not reach the classroom. Reload to try again.'; }
  });
  let last = 0; // keep presence fresh: position every 3s while moving, heartbeat every 15s
  setInterval(() => {
    if (!joined) return;
    const v = players.get(MY_ID);
    if (v && me.seat == null) { me.x = v.target.x; me.z = v.target.z; me.ry = v.target.ry; }
    if (posDirty || Date.now() - last > 15000) { posDirty = false; last = Date.now(); track(); }
    onPresence();
  }, 3000);
}

function note(text) { const n = $('notice'); n.textContent = text; n.classList.remove('hidden'); clearTimeout(noticeTimer); noticeTimer = setTimeout(() => n.classList.add('hidden'), 4500); }

// ================= Sitting =================
function sitDown(index) {
  if (roster.some((p) => p.seat === index && p.id !== MY_ID)) return note('That seat is taken.');
  const s = seats[index];
  me.seat = index; me.x = s.x; me.z = s.z; me.ry = Math.PI;
  const v = players.get(MY_ID); v.target = { x: s.x, z: s.z, ry: Math.PI };
  track();
}
function standUp() {
  if (me.seat == null) return;
  const s = seats[me.seat];
  me.seat = null; me.x = s.x + 1; me.z = s.z + 0.2; me.ry = 0;
  const v = players.get(MY_ID); if (v) v.target = { x: me.x, z: me.z, ry: 0 };

}

// ================= Whiteboard (3D texture) =================
let boardQueued = false;
function drawBoard() { if (!boardQueued) { boardQueued = true; requestAnimationFrame(paintBoard); } }
function wrapLines(ctx, text, maxW) {
  const out = [];
  for (const para of text.split('\n')) {
    let line = '';
    for (const word of para.split(' ')) {
      const t = line ? line + ' ' + word : word;
      if (ctx.measureText(t).width > maxW && line) { out.push(line); line = word; } else line = t;
    }
    out.push(line);
  }
  return out;
}
function paintBoard() {
  boardQueued = false;
  const c = bctx, W = boardCanvas.width, H = boardCanvas.height;
  c.fillStyle = '#fbfbf8'; c.fillRect(0, 0, W, H);
  const spot = board.spotlight && panes.get(board.spotlight);
  c.fillStyle = spot ? '#d9480f' : '#1c4f9c';
  c.font = 'bold 52px system-ui, sans-serif';
  c.fillText(spot ? `Spotlight: ${nameOf(board.spotlight)}` : 'Problem', 40, 70);
  c.fillStyle = '#999'; c.font = '22px system-ui, sans-serif';
  c.fillText('Click the board to open it', W - 290, 60);
  if (spot) {
    c.font = '36px ui-monospace, Menlo, Consolas, monospace'; c.fillStyle = '#222';
    const lines = spot.text.split('\n'); const maxLines = spot.output ? 8 : 10;
    lines.slice(0, maxLines).forEach((l, i) => c.fillText(l.slice(0, 56), 40, 130 + i * 40));
    if (lines.length > maxLines) c.fillText(`… ${lines.length - maxLines} more lines (click to see all)`, 40, 130 + maxLines * 40);
    if (spot.output) {
      c.fillStyle = spot.error ? '#b00020' : '#1b7f3a'; c.font = '32px ui-monospace, Menlo, Consolas, monospace';
      spot.output.split('\n').slice(-2).forEach((l, i) => c.fillText('> ' + l.slice(0, 60), 40, H - 70 + i * 38));
    }
  } else {
    c.fillStyle = '#222'; c.font = '40px system-ui, sans-serif';
    const text = board.problem || (professorId ? 'Waiting for the professor to post a problem…' : 'No professor yet. You can still write code: press B.');
    wrapLines(c, text, W - 80).slice(0, 9).forEach((l, i) => c.fillText(l, 40, 140 + i * 48));
  }
  boardTex.needsUpdate = true;
}

// ================= Whiteboard overlay (tabs, editor, run) =================
let activeTab = 'problem';
const cm = CodeMirror($('editorWrap'), { mode: 'python', theme: 'material-darker', lineNumbers: true, indentUnit: 4, tabSize: 4, indentWithTabs: false, extraKeys: { Tab: (c) => c.replaceSelection('    ') } });

cm.on('change', (inst, change) => {

function openBoard(tab) {

function renderPane(liveUpdate) {
  const title = $('paneTitle'), view = $('problemView'), edit = $('problemEdit'), wrap = $('editorWrap'), out = $('output');
  title.innerHTML = '';

      if (board.spotlight) title.appendChild(button('Clear spotlight', '', () => { board.spotlight = null; sendBoard(); refreshUI(); }));
    } else {
      edit.classList.add('hidden'); view.classList.remove('hidden');

    }

  view.classList.add('hidden'); edit.classList.add('hidden'); wrap.classList.remove('hidden');
  const mine = activeTab === MY_ID;

  who.textContent = mine ? 'Your code' : `${nameOf(activeTab)}'s code (live, read-only)`;

  if (isProfessor()) {

      board.spotlight = on ? null : activeTab; sendBoard(); refreshUI();
    }));

  }
  if (!liveUpdate) { cm.clearHistory(); setTimeout(() => { cm.refresh(); if (mine) cm.focus(); }, 0); }
  const local = localRuns.get(activeTab);
  const shown = local ? local.out : pane.output;
  out.classList.toggle('hidden', !shown);
  out.classList.toggle('err', local ? local.error : pane.error);
  out.textContent = shown || '';
}

// Pyodide runs in a Web Worker so a runaway loop can be stopped.
const localRuns = new Map(); // output of someone else's code that I ran on my computer
let worker = null, workerReady = null;
function getWorker() {
  if (workerReady) return workerReady;
  const src = `importScripts(${JSON.stringify(PYODIDE_URL + 'pyodide.js')});
    const ready = loadPyodide({ indexURL: ${JSON.stringify(PYODIDE_URL)} });
    onmessage = async (e) => {
      const py = await ready; let out = ''; let error = false;
      py.setStdout({ batched: (s) => { out += s + '\\n'; } });
      py.setStderr({ batched: (s) => { out += s + '\\n'; } });
      try { await py.runPythonAsync(e.data); } catch (err) {
        error = true;
        const lines = String(err.message || err).trim().split('\\n');
        const at = lines.findIndex((l) => l.includes('File "<exec>"'));
        out += (at >= 0 ? lines.slice(at) : lines.slice(-4)).join('\\n');
      }
      postMessage({ out: out.slice(0, 4000), error });
    };
    ready.then(() => postMessage({ ready: true }), (err) => postMessage({ failed: String(err) }));`;
  worker = new Worker(URL.createObjectURL(new Blob([src], { type: 'text/javascript' })));
  workerReady = new Promise((resolve, reject) => {
    worker.onmessage = (e) => { if (e.data.ready) resolve(worker); else if (e.data.failed) reject(new Error('Python failed to load: ' + e.data.failed)); };
    worker.onerror = () => reject(new Error('Python failed to load. Check your connection.'));
  });
  workerReady.catch(() => { worker = null; workerReady = null; });
  return workerReady;
}
async function runPane(id) {
  const out = $('output'), pane = panes.get(id); if (!pane) return;
  out.classList.remove('hidden', 'err');
  out.textContent = worker ? 'Running…' : 'Loading Python (the first run takes a few seconds)…';
  let result;
  try {
    const w = await getWorker();
    result = await new Promise((resolve) => {
      const t = setTimeout(() => { w.terminate(); worker = null; workerReady = null; resolve({ out: 'Stopped: the code ran longer than 10 seconds.', error: true }); }, 10000);
      w.onmessage = (e) => { if (!e.data.ready) { clearTimeout(t); resolve(e.data); } };
      w.postMessage(pane.text);
    });
  } catch (err) { result = { out: String(err.message || err), error: true }; }
  const text = result.out.trim() || '(no output)';
  if (id === MY_ID) {
    pane.output = text; pane.error = result.error;
    send('code', { text: pane.text, output: pane.output, error: pane.error });
    if (board.spotlight === MY_ID) drawBoard();
  } else localRuns.set(id, { out: text + '\n(ran on your computer only)', error: result.error });
  if (activeTab === id && boardOpen()) renderPane(true);
}

// ================= Input =================
const keys = new Set();
const chatInput = $('chatInput');
addEventListener('keydown', (e) => {
  if (!joined) return;
  if (boardOpen()) { if (e.key === 'Escape') closeBoard(); return; }
  if (document.activeElement === chatInput) {
    if (e.key === 'Enter') {
      const text = chatInput.value.trim().slice(0, 200);
      if (text) { send('chat', { text }); showBubble(MY_ID, text); logChat(MY_ID, text); }
      chatInput.value = ''; chatInput.blur();
    } else if (e.key === 'Escape') chatInput.blur();
    return;
  }
  if (e.key === 'Enter') { e.preventDefault(); chatInput.focus(); return; }
  if (e.key === 'h' || e.key === 'H') return setHand(!me.hand);
  if (e.key === 'b' || e.key === 'B') return openBoard();
  if (e.key === 'Escape') zoomId = null;
  if (e.key.startsWith('Arrow')) { e.preventDefault(); keys.add(e.key); zoomId = null; if (me.seat != null) standUp(); }
});
addEventListener('keyup', (e) => keys.delete(e.key));
addEventListener('blur', () => keys.clear());

const raycaster = new THREE.Raycaster(), mouse = new THREE.Vector2();
renderer.domElement.addEventListener('click', (e) => {
  if (!joined) return;
  chatInput.blur();
  mouse.set((e.clientX / innerWidth) * 2 - 1, -(e.clientY / innerHeight) * 2 + 1);
  raycaster.setFromCamera(mouse, camera);
  const hit = raycaster.intersectObjects([boardMesh, ...pickables, ...chairMeshes], false)[0];
  if (!hit) { zoomId = null; return; }
  if (hit.object === boardMesh) return openBoard(board.spotlight || undefined);
  if (hit.object.userData.seat != null) return sitDown(hit.object.userData.seat);
  if (hit.object.userData.id) zoomId = hit.object.userData.id;
});
addEventListener('resize', () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });

// ================= Loop =================
const clock = new THREE.Clock();
const camGoal = new THREE.Vector3(), lookGoal = new THREE.Vector3(), look = new THREE.Vector3(0, 1.5, -4), tmp = new THREE.Vector3();
let lastSent = 0, moveDirty = false;
const SPEED = 4.5;
function collide(x, z) {
  x = Math.max(-ROOM.w / 2 + 0.5, Math.min(ROOM.w / 2 - 0.5, x));
  z = Math.max(-ROOM.d / 2 + 1, Math.min(ROOM.d / 2 - 0.5, z));
  for (const b of solids) {
    const dx = x - b.x, dz = z - b.z, px = b.hw + 0.3 - Math.abs(dx), pz = b.hd + 0.3 - Math.abs(dz);
    if (px > 0 && pz > 0) { if (px < pz) x += Math.sign(dx || 1) * px; else z += Math.sign(dz || 1) * pz; }
  }
  return [x, z];
}

function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05), t = clock.elapsedTime;
  const mine = joined && players.get(MY_ID);
  if (mine && me.seat == null) {
    let dx = 0, dz = 0;
    if (keys.has('ArrowUp')) dz -= 1;
    if (keys.has('ArrowDown')) dz += 1;
    if (keys.has('ArrowLeft')) dx -= 1;
    if (keys.has('ArrowRight')) dx += 1;
    if (dx || dz) {
      const len = Math.hypot(dx, dz);
      const [nx, nz] = collide(mine.target.x + (dx / len) * SPEED * dt, mine.target.z + (dz / len) * SPEED * dt);
      mine.target = { x: nx, z: nz, ry: Math.atan2(dx, dz) };
      moveDirty = posDirty = true;
    }
    if (moveDirty && t - lastSent > 0.1) { send('move', mine.target); lastSent = t; moveDirty = false; }
  }
  for (const [id, v] of players) {
    const g = v.group, tg = v.target, seated = (id === MY_ID ? me?.seat : v.meta.seat) != null;
    const k = id === MY_ID ? 1 : 1 - Math.exp(-12 * dt);
    const moving = Math.hypot(tg.x - g.position.x, tg.z - g.position.z) > 0.01;
    g.position.x += (tg.x - g.position.x) * k;
    g.position.z += (tg.z - g.position.z) * k;
    let dr = tg.ry - g.rotation.y; dr = Math.atan2(Math.sin(dr), Math.cos(dr));
    g.rotation.y += dr * (1 - Math.exp(-14 * dt));
    v.bob = moving && !seated ? v.bob + dt * 12 : v.bob * 0.85;
    g.position.y = seated ? -0.18 : Math.abs(Math.sin(v.bob)) * 0.07;
  }
  // Camera: behind me, facing the whiteboard; or close to someone I clicked.
  const focus = players.get(zoomId) || mine;
  if (focus) {
    const fp = focus.group.position;
    if (zoomId && players.has(zoomId)) {
      tmp.set(camera.position.x - fp.x, 0, camera.position.z - fp.z);
      if (tmp.lengthSq() < 0.01) tmp.set(0, 0, 1);
      tmp.normalize().multiplyScalar(3);
      camGoal.set(fp.x + tmp.x, 2, fp.z + tmp.z); lookGoal.set(fp.x, 1.25, fp.z);
    } else {
      camGoal.set(fp.x * 0.6, 4.6, Math.min(fp.z + 6.5, ROOM.d / 2 - 0.3)); lookGoal.set(fp.x * 0.5, 1.4, fp.z - 4);
    }
    const c = 1 - Math.exp(-4 * dt);
    camera.position.lerp(camGoal, c); look.lerp(lookGoal, c); camera.lookAt(look);
  } else {
    camera.position.set(Math.sin(t * 0.15) * 3, 5, 8.5); camera.lookAt(0, 1.8, -5);
  }
  renderer.render(scene, camera);
  for (const v of players.values()) {
    tmp.copy(v.group.position); tmp.y += 1.85; tmp.project(camera);
    const vis = tmp.z < 1 && Math.abs(tmp.x) < 1.2 && Math.abs(tmp.y) < 1.2;
    v.tag.style.display = vis ? '' : 'none';
    if (vis) { v.tag.style.left = ((tmp.x + 1) / 2) * innerWidth + 'px'; v.tag.style.top = ((1 - tmp.y) / 2) * innerHeight + 'px'; }
  }
}
drawBoard();
animate();
connect();

window.__pc = { players, panes, board, camera, seats, chairMeshes, boardMesh, cm, get roster() { return roster; }, get me() { return me; }, get professorId() { return professorId; }, get zoomId() { return zoomId; }, get activeTab() { return activeTab; } };
</script>
